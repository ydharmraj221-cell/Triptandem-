<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndicRide</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .box { max-width: 400px; margin: 30px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; }
        .hidden { display: none; }
        #msg, #booking-msg { font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🏍️ IndicRide 🚗</h1>

    <!-- STEP 1: लॉगिन स्क्रीन -->
    <div id="auth-box" class="box">
        <h3>अकाउंट लॉगिन / रजिस्टर</h3>
        <input type="email" id="email" placeholder="ईमेल आईडी डालें" value="test@gmail.com" required>
        <input type="password" id="password" placeholder="पासवर्ड डालें" value="123456" required>
        <button onclick="handleLogin()">लॉगिन करें (Login)</button>
        <p id="msg" style="color: green;"></p>
    </div>

    <!-- STEP 2: बुकिंग स्क्रीन -->
    <div id="booking-box" class="box hidden">
        <h3 style="color: #28a745;">👋 राइड बुक करें</h3>
        <input type="text" id="pickup" placeholder="पिकअप लोकेशन (Pickup)" required>
        <input type="text" id="destination" placeholder="ड्रॉप लोकेशन (Destination)" required>
        
        <select id="vehicle_type">
            <option value="bike">🏍️ बाइक (₹8/किमी)</option>
            <option value="car">🚗 कार (₹15/किमी)</option>
        </select>
        <input type="number" id="passenger" placeholder="यात्रियों की संख्या" min="1" max="4" value="1">
        <input type="date" id="trip_date" required>
        <button onclick="confirmBooking()">🚀 बुकिंग कन्फर्म करें</button>
        <p id="booking-msg"></p>
    </div>

    <script>
        // सीधे लॉगिन कराने का फंक्शन (नो एरर झंझट)
        function handleLogin() {
            const msg = document.getElementById('msg');
            msg.innerText = "लॉगिन सफल! ऐप खुल रहा है...";
            
            setTimeout(() => {
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('booking-box').classList.remove('hidden');
            }, 400);
        }

        // बुकिंग कन्फर्म करने का फंक्शन
        function confirmBooking() {
            const pickup = document.getElementById('pickup').value;
            const destination = document.getElementById('destination').value;
            const vehicle_type = document.getElementById('vehicle_type').value;
            const trip_date = document.getElementById('trip_date').value;
            const bookingMsg = document.getElementById('booking-msg');

            if(!pickup || !destination || !trip_date) {
                bookingMsg.style.color = "red"; 
                bookingMsg.innerText = "कृपया पूरी जानकारी भरें!"; 
                return;
            }

            bookingMsg.style.color = "orange"; 
            bookingMsg.innerText = "बुकिंग सुरक्षित की जा रही है...";
            
            // फिक्स किराया कैलकुलेशन
            const mockDistance = 15;
            const calculatedFare = mockDistance * (vehicle_type === 'bike' ? 8 : 15);

            setTimeout(() => {
                bookingMsg.style.color = "green"; 
                bookingMsg.innerText = `🎉 IndicRide बुकिंग सफल! अनुमानित किराया: ₹${calculatedFare}`;
            }, 600);
        }
    </script>
</body>
</html>
