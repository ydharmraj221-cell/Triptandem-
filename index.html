<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndicRide</title>
    <!-- Leaflet.js (मुफ़्त मैप लाइब्रेरी) की CSS और JS फाइल्स -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .box { max-width: 450px; margin: 20px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: left; }
        h1, h3 { text-align: center; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { font-weight: bold; border: none; cursor: pointer; color: white; }
        .btn-green { background: #28a745; }
        .btn-blue { background: #007bff; }
        .btn-red { background: #dc3545; }
        .hidden { display: none !important; }
        .nav-tabs { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .tab { padding: 10px; background: #ddd; border-radius: 5px; cursor: pointer; width: 45%; text-align: center; font-weight: bold; color: black; }
        .active-tab { background: #007bff; color: white; }
        .booking-card { background: #f8f9fa; border-left: 5px solid #007bff; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .status-badge { font-weight: bold; padding: 3px 8px; border-radius: 3px; font-size: 12px; float: right; }
        /* नक्शे का डिज़ाइन */
        #map { height: 250px; width: 100%; border-radius: 5px; margin: 10px 0; border: 1px solid #ccc; }
        .info-text { font-size: 14px; font-weight: bold; color: #333; margin: 5px 0; background: #e9ecef; padding: 8px; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>🏍️ IndicRide 🚗</h1>

    <!-- 1. लॉगिन बॉक्स -->
    <div id="auth-box" class="box">
        <h3>अकाउंट लॉगिन / रजिस्टर</h3>
        <input type="email" id="email" placeholder="ईमेल आईडी डालें" value="test@gmail.com" required>
        <input type="password" id="password" placeholder="पासवर्ड डालें" value="123456" required>
        <button class="btn-green" onclick="directLogin()">लॉगिन करें (Login)</button>
    </div>

    <!-- 2. मुख्य बुकिंग और राइडर सिस्टम -->
    <div id="main-app" class="hidden">
        
        <div class="nav-tabs">
            <div id="tab-customer" class="tab active-tab" onclick="switchRole('customer')">यात्री (Customer)</div>
            <div id="tab-rider" class="tab" onclick="switchRole('rider')">राइडर (Rider)</div>
        </div>

        <!-- यात्री बुकिंग फॉर्म -->
        <div id="customer-box" class="box">
            <h3>👋 राइड बुक करें</h3>
            <input type="text" id="pickup" placeholder="कहाँ से पिकअप करना है? (जैसे: Karwi)" value="Karwi, Chitrakoot" required>
            <input type="text" id="destination" placeholder="कहाँ जाना है? (जैसे: Banda)" value="Banda, Uttar Pradesh" required>
            
            <button class="btn-blue" type="button" onclick="calculateRoute()">🗺️ रूट और किराया चेक करें</button>

            <!-- लाइव मैप -->
            <div id="map"></div>
            
            <!-- दूरी और समय का लाइव डिस्प्ले -->
            <div id="route-info" class="hidden">
                <div class="info-text">🛣️ कुल दूरी: <span id="dist-val">0</span> किमी</div>
                <div class="info-text">⏱️ अनुमानित समय: <span id="time-val">0</span> मिनट</div>
                <div class="info-text" style="color: #28a745;">💰 अनुमानित किराया: ₹<span id="fare-val">0</span></div>
            </div>

            <select id="vehicle_type" onchange="updateFareDisplay()">
                <option value="bike">🏍️ बाइक (₹8/किमी, न्यूनतम ₹40)</option>
                <option value="car">🚗 कार (₹15/किमी, न्यूनतम ₹100)</option>
            </select>
            
            <input type="number" id="passenger" placeholder="यात्रियों की संख्या" min="1" max="4" value="1">
            <input type="date" id="trip_date" value="2026-10-21" required>
            
            <button class="btn-green" onclick="confirmBooking()">🚀 बुकिंग कन्फर्म करें</button>
            <p id="booking-msg" style="text-align:center; font-weight:bold;"></p>
        </div>

        <!-- राइडर डैशबोर्ड -->
        <div id="rider-box" class="box hidden">
            <h3>🏍️ राइडर डैशबोर्ड</h3>
            <div id="rider-bookings-list">
                <p style="text-align:center; color:#999;">अभी कोई बुकिंग उपलब्ध नहीं है।</p>
            </div>
        </div>

        <!-- लाइव रिकॉर्ड -->
        <div class="box">
            <h3>📊 बुकिंग का लाइव रिकॉर्ड</h3>
            <div id="global-bookings-list">
                <p style="text-align:center; color:#999;">कोई रिकॉर्ड नहीं है।</p>
            </div>
        </div>

    </div>

    <script>
        let bookingsData = [];
        let map, routePolyline;
        let currentDistanceKm = 0;

        function directLogin() {
            document.getElementById('auth-box').style.setProperty('display', 'none', 'important');
            document.getElementById('main-app').classList.remove('hidden');
            
            // लॉगिन होते ही मैप इनिशियलाइज़ करें
            setTimeout(() => {
                if (!map) {
                    map = L.map('map').setView([25.2078, 80.9166], 9); // चित्रकूट का डिफ़ॉल्ट कोऑर्डिनेट
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19
                    }).addTo(map);
                }
            }, 200);

            renderBookings();
        }

        // मुफ़्त जियोकोडिंग और ओएसआरएम से लाइव दूरी निकालने का जादुई फंक्शन
        async function calculateRoute() {
            const pickupName = document.getElementById('pickup').value;
            const destName = document.getElementById('destination').value;
            const bookingMsg = document.getElementById('booking-msg');

            if(!pickupName || !destName) {
                alert("कृपया पिकअप और ड्रॉप दोनों जगह भरें!");
                return;
            }

            bookingMsg.style.color = "orange";
            bookingMsg.innerText = "रूट और किराया कैलकुलेट किया जा रहा है...";

            try {
                // 1. पिकअप जगह के कोऑर्डिनेट्स खोजना
                const pRes = await fetch(`https://openstreetmap.org{encodeURIComponent(pickupName)}`);
                const pData = await pRes.json();
                // 2. डेस्टिनेशन जगह के कोऑर्डिनेट्स खोजना
                const dRes = await fetch(`https://openstreetmap.org{encodeURIComponent(destName)}`);
                const dData = await dRes.json();

                if(pData.length === 0 || dData.length === 0) {
                    bookingMsg.style.color = "red";
                    bookingMsg.innerText = "दिए गए स्थानों को खोजने में असमर्थ। कृपया नाम सही लिखें!";
                    return;
                }

                const start = [pData[0].lat, pData[0].lon];
                const end = [dData[0].lat, dData[0].lon];

                // 3. मुफ़्त OSRM API से असली ड्राइविंग दूरी और समय निकालना
                const routeRes = await fetch(`https://project-osrm.org{start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`);
                const routeData = await routeRes.json();

                if(!routeData.routes || routeData.routes.length === 0) {
                    bookingMsg.style.color = "red";
                    bookingMsg.innerText = "रास्ता नहीं मिल पाया!";
                    return;
                }

                const route = routeData.routes[0];
                currentDistanceKm = (route.distance / 1000).toFixed(1); // मीटर को किमी में बदला
                const durationMins = Math.round(route.duration / 60); // सेकंड को मिनट में बदला

                // मैप अपडेट करना और रेखा खींचना
                if (routePolyline) map.removeLayer(routePolyline);
                const coordinates = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
                routePolyline = L.polyline(coordinates, {color: 'blue', weight: 5}).addTo(map);
                map.fitBounds(routePolyline.getBounds());

                // डेटा रेंडर करना
                document.getElementById('dist-val').innerText = currentDistanceKm;
                document.getElementById('time-val').innerText = durationMins;
                document.getElementById('route-info').classList.remove('hidden');
                
                updateFareDisplay();
                bookingMsg.innerText = "";

            } catch (err) {
                bookingMsg.style.color = "red";
                bookingMsg.innerText = "नेटवर्क स्लो है, कृपया दोबारा प्रयास करें!";
            }
        }

        // वाहन के अनुसार लाइव किराया बदलने का फंक्शन
        function updateFareDisplay() {
            if(currentDistanceKm === 0) return;
            const vehicle = document.getElementById('vehicle_type').value;
            let fare = 0;

            if(vehicle === 'bike') {
                fare = Math.max(40, Math.round(currentDistanceKm * 8));
            } else {
                fare = Math.max(100, Math.round(currentDistanceKm * 15));
            }
            document.getElementById('fare-val').innerText = fare;
        }

        // बुकिंग कन्फर्म करने का फंक्शन
        function confirmBooking() {
            const pickup = document.getElementById('pickup').value;
            const destination = document.getElementById('destination').value;
            const vehicle_type = document.getElementById('vehicle_type').value;
            const trip_date = document.getElementById('trip_date').value;
            const passenger = document.getElementById('passenger').value;
