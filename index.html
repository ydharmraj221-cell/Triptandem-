
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripTandem | Explore Your Way</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:white}
header{padding:22px 6%;display:flex;justify-content:space-between;align-items:center;background:#101d30}
.logo{font-size:24px;font-weight:bold;color:#66f0c0}
.hero{padding:55px 6%;text-align:center;background:linear-gradient(140deg,#102b42,#07111f)}
h1{font-size:clamp(34px,7vw,58px);margin:10px 0}
p{color:#b9c9da;line-height:1.6}
.card{background:#122239;padding:22px;border-radius:18px;max-width:600px;margin:25px auto;text-align:left}
label{display:block;margin:14px 0 7px}
input,select,button{width:100%;padding:14px;border-radius:9px;border:1px solid #344761;font-size:16px}
input,select{background:#091627;color:white}
button{background:#66f0c0;color:#07111f;font-weight:bold;border:0;margin-top:18px;cursor:pointer}
.features{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:20px}
.feature{background:#122239;padding:18px;border-radius:12px}
footer{text-align:center;padding:25px;color:#9eb0c5}
</style>
</head>
<body>
<header><div class="logo">TripTandem</div><span>🌍 Explore freely</span></header>
<section class="hero">
<p>YOUR JOURNEY, YOUR WAY</p>
<h1>Discover More.<br>Travel Better.</h1>
<p>Plan sightseeing trips by bike or car across India and beyond.</p>
<div class="card">
<h2>Plan Your Trip</h2>
<form id="trip">
<label>Vehicle</label>
<select id="vehicle"><option>Bike</option><option>Car - Hatchback</option><option>Car - Sedan</option><option>Car - SUV</option></select>
<label>Pickup location</label>
<input id="pickup" placeholder="Where should we pick you up?" required>
<label>Places you want to visit</label>
<input id="places" placeholder="Add sightseeing destinations" required>
<label>Trip date</label>
<input id="date" type="date" required>
<label>Language</label>
<select><option>English</option><option>Hindi</option></select>
<button type="submit">Request Trip</button>
</form>
<p id="message"></p>
</div>
</section>
<section class="features">
<div class="feature">🏍️ Bike Trips</div>
<div class="feature">🚗 Car Sightseeing</div>
<div class="feature">🌏 India & Worldwide Vision</div>
</section>
<footer>TripTandem · Travel your way</footer>
<script>
document.getElementById('trip').addEventListener('submit',function(e){
e.preventDefault();
const v=document.getElementById('vehicle').value;
const p=document.getElementById('pickup').value;
const d=document.getElementById('places').value;
const date=document.getElementById('date').value;
const msg='Trip request prepared: '+v+' | Pickup: '+p+' | Places: '+d+' | Date: '+date;
document.getElementById('message').textContent=msg;
});
</script>
</body>
</html>
